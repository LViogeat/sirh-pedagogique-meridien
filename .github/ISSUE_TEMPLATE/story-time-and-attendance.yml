name: "User story — Gestion des temps et activités"
description: Une fonctionnalité du module Gestion des temps et activités, rédigée pour être donnée à Copilot.
title: "[Temps et activités] "
labels: ["user-story", "time-and-attendance"]
body:
  - type: markdown
    attributes:
      value: |
        **Une story = un écran = un fichier `.vue`.** Si votre story demande deux écrans, faites-en deux.
        Ce que vous écrivez ici est ce que vous collerez dans Copilot : plus c'est précis, plus le code marche du premier coup.

  - type: input
    id: role
    attributes:
      label: En tant que…
      description: Qui utilise l'écran ? Un rôle de l'hôtel, pas « l'utilisateur ».
      placeholder: "gouvernante générale de l'hôtel d'Annecy"
    validations:
      required: true

  - type: textarea
    id: besoin
    attributes:
      label: Je veux…
      description: Ce que la personne fait sur l'écran. Des verbes, pas des boutons.
      placeholder: "voir mon équipe housekeeping avec le temps de travail de chacun, et saisir une absence"
    validations:
      required: true

  - type: input
    id: but
    attributes:
      label: Afin de…
      description: Pourquoi c'est utile. Si vous ne savez pas le dire, la story n'est pas prête.
      placeholder: "savoir combien d'heures je peux planifier cette semaine"
    validations:
      required: true

  - type: input
    id: ecran
    attributes:
      label: Le fichier de l'écran
      description: "Son nom, dans app/src/modules/gta/. En PascalCase, terminé par .vue."
      placeholder: "EquipePlanning.vue"
    validations:
      required: true

  - type: checkboxes
    id: donnees
    attributes:
      label: Les données que l'écran lit
      description: Cochez tout ce qui sert. C'est ce qui dira à Copilot quelles fonctions du SDK utiliser.
      options:
        - label: "Salariés, avec leur temps de travail (work_time_ratio) — getSalaries()"
        - label: "Contrats actifs et leurs dates — getContrats({ statut: 'actif' })"
        - label: "Établissements — getEtablissements()"
        - label: "Départements, la maille de planification — getDepartements()"
        - label: "Postes — getPostes()"
        - label: "Nos propres tables (schéma gta)"

  - type: textarea
    id: tables
    attributes:
      label: Nos tables utilisées
      description: "Si l'écran lit ou écrit dans vos tables : leur nom et leurs colonnes. Collez le create table."
      render: sql

  - type: textarea
    id: criteres
    attributes:
      label: Critères d'acceptation
      description: |
        Écrits AVANT de coder, vérifiés APRÈS. Les données du cours ne changent jamais : mettez des chiffres.
        Parcourez le socle pour les trouver.
      value: |
        Étant donné que je suis sur l'écran …
        Quand je …
        Alors je vois … (un chiffre précis : par exemple « 23 salariés à temps partiel », « 36 salariés à Nice »)
    validations:
      required: true

  - type: textarea
    id: hors
    attributes:
      label: Ce que la story ne fait pas
      description: Ce que vous laissez pour plus tard. Ça évite que Copilot en fasse trop.

  - type: textarea
    id: maquette
    attributes:
      label: Maquette
      description: Un croquis photographié, une capture annotée. Glissez l'image ici.

  - type: checkboxes
    id: pret
    attributes:
      label: La story est prête quand…
      options:
        - label: Le PO l'a relue et elle tient en un écran
          required: true
        - label: Les critères contiennent au moins un chiffre vérifiable dans le socle
          required: true
