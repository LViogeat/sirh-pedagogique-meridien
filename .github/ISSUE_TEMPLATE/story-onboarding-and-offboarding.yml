name: "User story — Onboarding & Offboarding"
description: Une fonctionnalité du module Onboarding & Offboarding, rédigée pour être donnée à Copilot.
title: "[Onboarding] "
labels: ["user-story", "onboarding-and-offboarding"]
body:
  - type: markdown
    attributes:
      value: |
        **Une story = un écran = un fichier `.vue`.** Si votre story demande deux écrans, faites-en deux.
        Ce que vous écrivez ici est ce que vous collerez dans Copilot : plus c'est précis, plus le code marche du premier coup.

  - type: input
    id: role
    attributes:
      label: En tant que…
      description: Qui utilise l'écran ? Un rôle de l'hôtel, pas « l'utilisateur ».
      placeholder: "assistante RH de l'hôtel de Nice"
    validations:
      required: true

  - type: textarea
    id: besoin
    attributes:
      label: Je veux…
      description: Ce que la personne fait sur l'écran. Des verbes, pas des boutons.
      placeholder: "voir les arrivées à préparer, et cocher pour chacune les étapes de sa checklist"
    validations:
      required: true

  - type: input
    id: but
    attributes:
      label: Afin de…
      description: Pourquoi c'est utile. Si vous ne savez pas le dire, la story n'est pas prête.
      placeholder: "que chaque nouvel arrivant ait son badge, sa tenue et son parrain le premier jour"
    validations:
      required: true

  - type: input
    id: ecran
    attributes:
      label: Le fichier de l'écran
      description: "Son nom, dans app/src/modules/onb/. En PascalCase, terminé par .vue."
      placeholder: "ArriveesAPreparer.vue"
    validations:
      required: true

  - type: checkboxes
    id: donnees
    attributes:
      label: Les données que l'écran lit
      description: Cochez tout ce qui sert. C'est ce qui dira à Copilot quelles fonctions du SDK utiliser.
      options:
        - label: "Arrivées et départs — getSalaries({ statut }) avec joined_on / left_on"
        - label: "Contrats à venir — getContrats({ statut: 'a_venir' })"
        - label: "Postes et compétences attendues — getPoste(id)"
        - label: "Départements — getDepartements()"
        - label: "Établissements — getEtablissements()"
        - label: "Nos propres tables (schéma onb)"

  - type: textarea
    id: tables
    attributes:
      label: Nos tables utilisées
      description: "Si l'écran lit ou écrit dans vos tables : leur nom et leurs colonnes. Collez le create table."
      render: sql

  - type: textarea
    id: criteres
    attributes:
      label: Critères d'acceptation
      description: |
        Écrits AVANT de coder, vérifiés APRÈS. Les données du cours ne changent jamais : mettez des chiffres.
        Parcourez le socle pour les trouver.
      value: |
        Étant donné que je suis sur l'écran …
        Quand je …
        Alors je vois … (un chiffre précis : un chiffre relevé dans le socle, par exemple « … arrivées à préparer à Nice »)
    validations:
      required: true

  - type: textarea
    id: hors
    attributes:
      label: Ce que la story ne fait pas
      description: Ce que vous laissez pour plus tard. Ça évite que Copilot en fasse trop.

  - type: textarea
    id: maquette
    attributes:
      label: Maquette
      description: Un croquis photographié, une capture annotée. Glissez l'image ici.

  - type: checkboxes
    id: pret
    attributes:
      label: La story est prête quand…
      options:
        - label: Le PO l'a relue et elle tient en un écran
          required: true
        - label: Les critères contiennent au moins un chiffre vérifiable dans le socle
          required: true
