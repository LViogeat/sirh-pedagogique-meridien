name: "User story — Portail RH & Self-Service"
description: Une fonctionnalité du module Portail RH & Self-Service, rédigée pour être donnée à Copilot.
title: "[Portail RH] "
labels: ["user-story", "employee-self-service"]
body:
  - type: textarea
    id: story
    attributes:
      label: La story
      description: Une phrase, en remplaçant les points. Un seul écran.
      value: |
        En tant que …
        je veux …
        afin de …
    validations:
      required: true

  - type: textarea
    id: criteres
    attributes:
      label: Comment je saurai que c'est bon
      description: Ce que je dois voir ou pouvoir faire sur l'écran.
      placeholder: "Je vois la liste des postes en sous-effectif de mon hôtel."
    validations:
      required: true
