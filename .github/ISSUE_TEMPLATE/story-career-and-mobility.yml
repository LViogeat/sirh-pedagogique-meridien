name: "User story — Mobilité & carrière"
description: Une fonctionnalité du module Mobilité & carrière, rédigée pour être donnée à Copilot.
title: "[Mobilité] "
labels: ["user-story", "career-and-mobility"]
body:
  - type: textarea
    id: story
    attributes:
      label: La story
      description: Une phrase, en remplaçant les points. Un seul écran.
      value: |
        En tant que …
        je veux …
        afin de …
    validations:
      required: true

  - type: textarea
    id: criteres
    attributes:
      label: Comment je saurai que c'est bon
      description: Ce que je dois voir à l'écran, avec un chiffre précis.
      placeholder: "Je vois 27 besoins dans la liste, dont 4 à Annecy."
    validations:
      required: true
