# Déploiement du socle sur le VPS.
#
#   cd /opt/sirh
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Ce fichier remplace docker-compose.yml, qui ne sert qu'au poste de travail.
# Les valeurs sensibles vivent dans /opt/sirh/.env, hors du dépôt.
#
# Deux choix structurants :
#   - la base n'est jamais publiée sur un port de l'hôte, elle n'est joignable
#     que par l'API, sur le réseau « interne » ;
#   - l'API rejoint en plus le réseau du reverse proxy déjà présent sur le
#     serveur, qui l'atteint sous le nom « sirh-api ». Elle n'ouvre donc aucun
#     port public de son côté.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - donnees:/var/lib/postgresql/data
    networks: [interne]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    container_name: sirh-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATE_REFERENCE: ${DATE_REFERENCE}
      GROUPES: ${GROUPES}
      JETON_ADMIN: ${JETON_ADMIN}
      ORIGINES_AUTORISEES: ${ORIGINES_AUTORISEES:-*}
      DELAI_MAX_SQL_MS: ${DELAI_MAX_SQL_MS:-5000}
      LIGNES_MAX_SQL: ${LIGNES_MAX_SQL:-2000}
    # Publiée sur la boucle locale uniquement : utile pour diagnostiquer
    # depuis le serveur, invisible depuis l'extérieur.
    ports:
      - "127.0.0.1:8001:8000"
    networks:
      interne:
      proxy:
        aliases: [sirh-api]

networks:
  interne:
  # Le réseau du reverse proxy qui tient déjà les ports 80 et 443.
  proxy:
    external: true
    name: ${RESEAU_PROXY}

volumes:
  donnees:
